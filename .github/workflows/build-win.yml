name: Build Windows x64

on:
  push:
    branches:
      - main
  workflow_dispatch: # 支持在 GitHub 网页一键手动触发

jobs:
  build:
    name: Build Windows x64 (Electron 43.2.0)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Assets & Bundles
        run: pnpm run build:all

      - name: Build Windows x64
        run: |
          pnpm exec electron-builder --win --x64 --publish never

      - name: Create Portable Zip from Unpacked
        shell: pwsh
        run: |
          if (Test-Path "build/win-unpacked") {
            Compress-Archive -Path "build/win-unpacked/*" -DestinationPath "build/Open-Yami-RPG-Editor-win-x64-portable.zip" -Force
            Write-Host "Portable zip package created."
          }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Open-Yami-RPG-Editor-win-x64-v43.2.0
          path: |
            build/Open-Yami-RPG-Editor-win-x64-portable.zip
            build/*.exe
          retention-days: 30
